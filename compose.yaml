name: smartqueue
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartqueue
      POSTGRES_PASSWORD: ${SMARTQUEUE_DB_PASSWORD:-smartqueue-local}
      POSTGRES_DB: smartqueue
    ports:
      - "127.0.0.1:5449:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartqueue -d smartqueue"]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"
volumes:
  postgres-data:
